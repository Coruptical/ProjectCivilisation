name: ProjectCivilisation
version: '${project.version}'
main: com.coruptical.projectcivilisation.ProjectCivilisation
api-version: '1.20'
authors: [Coruptical]
description: The core plugin of Project Civilisation.
commands:
  projectcivilisation_reload:
    description: Used to reload the config of the plugin.
    aliases:
      - pcr
  afactions:
    description: Used to manage factions under Project Civilisation.
    aliases:
      - af
  factions:
    description: Used to manage your faction as a member.
  fedit:
    description: Used to manage any faction.
  factionsmanage:
    description: Used to manage your own faction as an owner.