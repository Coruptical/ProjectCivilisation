# This config allows you to change certain values that control the Project Civilisation plugin
# Some of these values cannot be too low or too high, and you will see this under each section.
# DO NOT DELETE ANY KEYS/VALUES IN THIS CONFIG. ONLY CHANGE THEM.

# ---------------------------
# --- PERMISSIONS ---

# This is the node that controls the name of the admin permission for all admin commands under this plugin.
AdminPermission: 'projectcivilisation.admin'

# This is the message that is sent to a commandSender if they don't have permission.
NoPermissionMessage: '&cYou do not have permission to use this command.'

# This node controls the name of the permission for faction owners (aka allowing them to kick, etc.)
FactionOwnerPermission: 'projectcivilisation.factionowner'

# This node controls the name of the permission for faction privileges (aka claiming)
FactionAdminPermission: 'projectcivilisation.factionadmin'

# ---------------------------
# --- FACTIONS ---

# This node controls how often we update faction data into our database.
# Can be given as "s", "m", or "h". E.g. "10s" or "20m".
# If the server doesn't crash/restart often, this can be left as default (30m.)
DatabaseSaveInterval: '30m'

# This node controls whether we should do asynchronous radius claiming or not.
# Async radius claiming may be better lag-wise if you are trying to claim a very large area of chunks,
# and you don't want to lag the server. This has a change to cause problems though, so only use it if
# radius claiming is lagging the server. (The time taken to radius claim is show when you do the cmd.)
DoAsyncRadiusClaiming: false

# This node controls the radius of chunks a player can claim in at once.
# The default is 100.
ClaimingRadiusLimit: 100


# ---------------------------
# --- OTHER ---

# This is the prefix that is sent before every message under this plugin.
MessagePrefix: '&7[&bProject Civilisation&7] '